<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yuban – Geschlossener Test</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="tester.js" defer></script>
</head>
<body>

<h1>Yuban – Geschlossener Test</h1>

<main id="form-card">
  <form id="tester-form" novalidate>
    <p>
      <label>
        <input type="checkbox" id="consent">
        Ich interessiere mich für Chinesischlernen und möchte aktiv dazu beitragen,
        die App besser zu machen. Ich stimme zu, dass meine E-Mail-Adresse zum Zweck
        der Durchführung des geschlossenen Tests gespeichert und verwendet wird.
        Details: <a href="../privacy.html">Datenschutzerklärung</a>. Ich kann die
        Einwilligung jederzeit per E-Mail widerrufen.
        <strong>Ich verstehe außerdem, dass es sich um einen geschlossenen Test
        handelt und dass ich mit Fehlern, unfertigen Funktionen und kurzfristigen
        Änderungen rechnen muss.</strong>
      </label>
    </p>

    <p>
      <label for="google-email">E-Mail-Adresse deines Google-Kontos</label><br>
      <input id="google-email" type="email" autocomplete="email" required
             placeholder="du@gmail.com">
    </p>

    <p>
      <label for="contact-email">E-Mail zum Kontaktieren (optional)</label><br>
      <input id="contact-email" type="email" autocomplete="email"
             placeholder="andere@adresse.de"><br>
      <small>Leer lassen, wenn die Adresse mit deiner Google-E-Mail übereinstimmt.</small>
    </p>

    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAAGKLBvOa-tHIM7UO"
         data-callback="onTesterCaptcha"
         data-theme="auto"></div>

    <p>
      <button id="submit-button" type="submit">Für den Test anmelden</button>
    </p>
    <p id="form-status" role="status" aria-live="polite"></p>
  </form>
</main>

<section id="success-card" hidden>
  <h2>Angemeldet.</h2>
  <p>
    Deine Anmeldung ist gespeichert. Du bekommst eine E-Mail, sobald ich dich zum
    Test hinzufüge — und auch, falls es diesmal nicht klappt.
  </p>
  <p id="success-warning" hidden></p>
</section>

</body>
</html>
